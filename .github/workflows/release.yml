name: Publish container images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  validate-release:
    name: Validate release version
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.0
      - run: node .github/scripts/validate-release.mjs

  publish:
    name: Publish ${{ matrix.name }}
    needs:
      - ci
      - validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - name: robin-tools
            file: Dockerfile
          - name: robin-tools-server
            file: server/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set immutable image coordinates
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an existing version image
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "Image ${IMAGE}:${VERSION} already exists; release tags are immutable." >&2
            exit 1
          fi
      - name: Build and publish multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Attest published image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign published image with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Record published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          FILE_NAME: ${{ matrix.name }}.json
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          node -e "
            const fs = require('node:fs');
            const record = {
              name: process.env.IMAGE_NAME,
              image: process.env.IMAGE,
              tag: process.env.VERSION,
              digest: process.env.DIGEST,
              reference: process.env.IMAGE + '@' + process.env.DIGEST,
            };
            fs.writeFileSync(process.env.FILE_NAME, JSON.stringify(record, null, 2) + '\n');
          "
      - name: Upload digest record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.name }}
          path: ${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish digest manifest
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download image digest records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - name: Build digest manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const images = fs.readdirSync('digests')
            .filter((name) => name.endsWith('.json'))
            .sort()
            .map((name) => JSON.parse(fs.readFileSync(path.join('digests', name), 'utf8')));
          if (images.length !== 2) {
            throw new Error(`Expected two image digests, found ${images.length}`);
          }
          const manifest = {
            release: process.env.RELEASE_TAG,
            repository: process.env.SOURCE_REPOSITORY,
            commit: process.env.SOURCE_COMMIT,
            images,
          };
          fs.writeFileSync('image-digests.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign digest manifest with GitHub OIDC
        run: |
          cosign sign-blob --yes \
            --bundle image-digests.sigstore.json \
            image-digests.json
      - name: Upload digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-${{ github.ref_name }}
          path: |
            image-digests.json
            image-digests.sigstore.json
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; release artifacts are immutable." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            image-digests.json image-digests.sigstore.json
