services:
  robin-tools:
    build:
      context: ../../..
      dockerfile: Dockerfile.standalone
    image: ${ROBIN_TOOLS_IMAGE:-robin-tools:standalone}
    container_name: ${ROBIN_TOOLS_CONTAINER_NAME:-robin-tools}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 150
    mem_limit: 512m
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "${ROBIN_TOOLS_BIND_ADDRESS:-127.0.0.1}:${ROBIN_TOOLS_PORT:-3003}:3003"
    environment:
      PORT: 3003
      NODE_ENV: production
      DEPLOYMENT_MODE: standalone
      DB_HOST: robin-tools-db
      DB_PORT: 5432
      DB_NAME: ${ROBIN_TOOLS_DB_NAME:-robin_tools}
      DB_USER: ${ROBIN_TOOLS_DB_USER:-robin_tools}
      DB_PASSWORD: ${ROBIN_TOOLS_DB_PASSWORD:?Set ROBIN_TOOLS_DB_PASSWORD to a strong password}
      MODULE_PROXY_SECRET: ${ROBIN_TOOLS_MODULE_PROXY_SECRET:?Set ROBIN_TOOLS_MODULE_PROXY_SECRET to a long random value}
      ROBIN_TOOLS_AUTH_MODE: ${ROBIN_TOOLS_AUTH_MODE:-basic}
      ROBIN_TOOLS_AUTH_USERNAME: ${ROBIN_TOOLS_AUTH_USERNAME:-admin}
      ROBIN_TOOLS_AUTH_PASSWORD_HASH: ${ROBIN_TOOLS_AUTH_PASSWORD_HASH:-}
      ROBIN_PTR_RESOLVERS: ${ROBIN_PTR_RESOLVERS:-}
      ROBIN_TOOLS_ALLOW_PRIVATE_PROBES: ${ROBIN_TOOLS_ALLOW_PRIVATE_PROBES:-false}
    depends_on:
      robin-tools-db:
        condition: service_healthy
    networks:
      - robin-tools-db
      # Robin Tools performs live DNS/SMTP/HTTPS checks against the public
      # internet, so (unlike the database) it needs a network with egress.
      - default

  robin-tools-db:
    image: postgres:18-alpine
    container_name: ${ROBIN_TOOLS_DB_CONTAINER_NAME:-robin-tools-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ROBIN_TOOLS_DB_NAME:-robin_tools}
      POSTGRES_USER: ${ROBIN_TOOLS_DB_USER:-robin_tools}
      POSTGRES_PASSWORD: ${ROBIN_TOOLS_DB_PASSWORD:?Set ROBIN_TOOLS_DB_PASSWORD to a strong password}
    volumes:
      - robin-tools-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ROBIN_TOOLS_DB_USER:-robin_tools} -d ${ROBIN_TOOLS_DB_NAME:-robin_tools}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - robin-tools-db

networks:
  robin-tools-db:
    internal: true

volumes:
  robin-tools-pgdata:
