services:
  robin-tools-client:
    build:
      context: .
    container_name: robin-tools-client
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=1m,mode=1777
    networks:
      - suite
  robin-tools-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: robin-tools-server
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 150
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      PORT: 3003
      # Local dev defaults to development so the production secret-guard
      # (rejects the default 'robin' DB password) doesn't block the local suite.
      # Production deploys set NODE_ENV=production with real secrets.
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres-backend
      DB_PORT: 5432
      DB_NAME: robin
      DB_USER: robin
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to the Robin database password}
      MODULE_PROXY_SECRET: ${MODULE_PROXY_SECRET:?Set MODULE_PROXY_SECRET to match robin-admin}
      ROBIN_PTR_RESOLVERS: ${ROBIN_PTR_RESOLVERS:-}
    networks:
      - suite

networks:
  suite:
    external: true
    name: suite_suite
